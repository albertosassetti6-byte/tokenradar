name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Permessi necessari per pubblicare su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/node- 適4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; else npm install -g typescript; fi

      - name: Compile TypeScript
        run: npx tsc

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Carica la radice del repository (contenente index.html, dist/, style.css)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
